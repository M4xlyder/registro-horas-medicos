<div class="profile-page">

  <div class="profile-header">

    <div>

      <div class="breadcrumb">

        <span>Configuración</span>

        <span>/</span>

        <strong>Mi perfil</strong>

      </div>

      <h1>Mi perfil</h1>

      <p>
        Consulta y administra la información de tu cuenta.
      </p>

    </div>

    <button
      type="button"
      class="back-button"
      (click)="volver()"
    >

      <svg viewBox="0 0 24 24">

        <path d="M19 12H5"></path>

        <path d="M12 19l-7-7 7-7"></path>

      </svg>

      Volver

    </button>

  </div>


  <div class="profile-layout">


    <!-- PERFIL -->

    <section class="profile-summary card">

      <div class="profile-avatar">

        {{ iniciales }}

      </div>

      <h2>

        {{ usuario.nombres }}

        {{ usuario.apellidos }}

      </h2>

      <p class="profile-position">

        {{ usuario.cargo }}

      </p>

      <div class="profile-status">

        <span class="status-check">

          <svg viewBox="0 0 24 24">

            <path d="M5 12l4 4L19 6"></path>

          </svg>

        </span>

        Cuenta activa

      </div>

    </section>


    <!-- INFORMACIÓN -->

    <section class="profile-information card">

      <div class="information-header">

        <div>

          <h2>
            Información personal
          </h2>

          <p>
            Datos asociados a tu cuenta.
          </p>

        </div>

        <button
          *ngIf="!editando"
          type="button"
          class="primary-button"
          (click)="activarEdicion()"
        >

          <svg viewBox="0 0 24 24">

            <path d="M12 20h9"></path>

            <path
              d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"
            ></path>

          </svg>

          Editar

        </button>

      </div>


      <div class="profile-fields">


        <!-- NOMBRES -->

        <div class="field">

          <label>
            Nombres
          </label>

          <input
            type="text"
            name="nombres"
            [(ngModel)]="usuario.nombres"
            [disabled]="!editando"
            placeholder="Ingrese sus nombres"
          />

        </div>


        <!-- APELLIDOS -->

        <div class="field">

          <label>
            Apellidos
          </label>

          <input
            type="text"
            name="apellidos"
            [(ngModel)]="usuario.apellidos"
            [disabled]="!editando"
            placeholder="Ingrese sus apellidos"
          />

        </div>


        <!-- USUARIO -->

        <div class="field">

          <label>
            Usuario
          </label>

          <input
            type="text"
            name="usuario"
            [(ngModel)]="usuario.usuario"
            [disabled]="!editando"
            placeholder="Ingrese su usuario"
          />

        </div>


        <!-- CARGO -->

        <div class="field">

          <label>
            Cargo
          </label>

          <input
            type="text"
            name="cargo"
            [(ngModel)]="usuario.cargo"
            [disabled]="!editando"
            placeholder="Ingrese su cargo"
          />

        </div>

      </div>


      <!-- MENSAJE -->

      <div
        *ngIf="mensaje"
        class="message"
      >

        {{ mensaje }}

      </div>


      <!-- BOTONES -->

      <div
        *ngIf="editando"
        class="profile-actions"
      >

        <button
          type="button"
          class="secondary-button"
          (click)="cancelarEdicion()"
        >

          Cancelar

        </button>

        <button
          type="button"
          class="primary-button"
          (click)="guardarCambios()"
        >

          Guardar cambios

        </button>

      </div>

    </section>

  </div>

</div>
